# Uso:  docker compose up --build
# API:  http://localhost:8080/api/products
name: order-system

services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-ordersystem}
      POSTGRES_USER: ${DB_USER:-ordersystem}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ordersystem}
    ports:
      - "${DB_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  app:
    build: .
    environment:
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-ordersystem}
      DB_USER: ${DB_USER:-ordersystem}
      DB_PASSWORD: ${DB_PASSWORD:-ordersystem}
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      database:
        # WildFly solo arranca cuando PostgreSQL acepta conexiones (no basta con que el contenedor exista)
        condition: service_healthy
    healthcheck:
      # Sin curl en la imagen: peticion HTTP minima con bash a GET /api/health (incluye SELECT 1 en la BD)
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /api/health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Pruebas de integracion HTTP contra la app desplegada (opcional, no arranca con "up"):
  #   docker compose --profile test run --rm integration-tests
  integration-tests:
    profiles: ["test"]
    image: maven:3.9-eclipse-temurin-21
    working_dir: /project
    command: ["mvn", "-B", "-Pit", "verify", "-Dapp.base-url=http://app:8080"]
    volumes:
      - ./:/project
      - maven-repo:/root/.m2
    depends_on:
      app:
        condition: service_healthy

volumes:
  pgdata:
  maven-repo:
